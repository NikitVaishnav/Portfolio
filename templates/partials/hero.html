<section id="hero" class="hero-section editorial-nude-bg">
    <div class="container hero-container">
        <!-- Left Side: Editorial Arch Portrait Frame with Double Outline & Diamond Sparkles -->
        <div class="hero-arch-column animate-fade-in delay-1">
            <div class="arch-frame-wrapper">
                <!-- Floating Diamond Sparkles -->
                <span class="sparkle-diamond sp-top-left">✦</span>
                <span class="sparkle-diamond sp-mid-left">✧</span>
                <span class="sparkle-diamond sp-bottom-right">✦</span>
                <span class="sparkle-diamond sp-top-right">✧</span>

                <!-- Double Outline Arch Frame -->
                <div class="hero-arch-outer">
                    <div class="hero-arch-inner">
                        <img src="/static/assets/avatar.svg" alt="Nikita Vaishnav — Developer Portrait" class="arch-portrait-img">
                        <div class="arch-overlay-badge">
                            <span class="status-indicator-dot"></span>
                            <span>{{ personal.status }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Grand Name, Subhead, Divider & Dark Pill Badges -->
        <div class="hero-editorial-content animate-fade-in delay-2">
            <h1 class="hero-editorial-name">
                NIKITA <span class="name-serif-light">VAISHNAV</span>
            </h1>

            <p class="hero-editorial-role">
                FULL STACK &amp; REACT DEVELOPER
            </p>

            <div class="editorial-divider"></div>

            <!-- Dynamic Role Typer Strip -->
            <div class="hero-dynamic-badge">
                <span class="badge-prefix">Core Focus: </span>
                <span id="typewriter-role" class="dynamic-role text-accent">React Frontend Architecture</span>
                <span class="cursor-blink">|</span>
            </div>

            <!-- Dark Pill Contact Badges (Matching Reference) -->
            <div class="hero-pill-contacts-list">
                <a href="#projects" class="dark-pill-item">
                    <span class="pill-icon-circle"><i data-lucide="link"></i></span>
                    <span class="pill-text">nikitavaishnav.dev</span>
                </a>
                <a href="mailto:{{ personal.email }}" class="dark-pill-item">
                    <span class="pill-icon-circle"><i data-lucide="mail"></i></span>
                    <span class="pill-text">{{ personal.email }}</span>
                </a>
                <a href="{{ personal.linkedin }}" target="_blank" rel="noopener noreferrer" class="dark-pill-item">
                    <span class="pill-icon-circle"><i data-lucide="linkedin"></i></span>
                    <span class="pill-text">linkedin.com/in/nikita-vaishnav</span>
                </a>
                <a href="{{ personal.github }}" target="_blank" rel="noopener noreferrer" class="dark-pill-item">
                    <span class="pill-icon-circle"><i data-lucide="github"></i></span>
                    <span class="pill-text">github.com/NikitVaishnav</span>
                </a>
            </div>

            <!-- Action Buttons -->
            <div class="hero-actions-row">
                <a href="#projects" class="btn btn-dark btn-lg">
                    <span>VIEW PREVIOUS WORK ✦</span>
                    <i data-lucide="arrow-right"></i>
                </a>
                <a href="{{ personal.resume_url }}" download="Nikita_Vaishnav_Resume.pdf" class="btn btn-secondary btn-lg" id="resume-download-btn">
                    <i data-lucide="file-text"></i>
                    <span>DOWNLOAD RESUME</span>
                </a>
                <a href="#contact" class="btn btn-outline btn-lg">
                    <i data-lucide="message-circle"></i>
                    <span>GET IN TOUCH</span>
                </a>
            </div>
        </div>
    </div>
</section>
