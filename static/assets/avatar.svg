<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#0f172a" stroke="url(#avatarGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Code Particle Orbit Lines -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2" stroke-dasharray="8 12"/>
  
  <!-- Stylized Developer Persona -->
  <!-- Shoulders / Jacket -->
  <path d="M 110 330 C 110 260, 290 260, 290 330 Z" fill="url(#avatarGrad)" opacity="0.9"/>
  <!-- Inner shirt -->
  <polygon points="175,270 225,270 200,315" fill="#0f172a"/>
  
  <!-- Neck -->
  <rect x="185" y="220" width="30" height="40" fill="#fed7aa" rx="6"/>
  
  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="45" ry="55" fill="#fed7aa"/>
  
  <!-- Hair (Modern sleek style) -->
  <path d="M 150 170 C 145 120, 255 120, 250 170 C 245 150, 240 140, 200 140 C 160 140, 155 150, 150 170 Z" fill="#1e293b"/>
  <path d="M 152 170 C 145 200, 140 235, 150 245 C 153 220, 160 200, 160 180 Z" fill="#1e293b"/>
  <path d="M 248 170 C 255 200, 260 235, 250 245 C 247 220, 240 200, 240 180 Z" fill="#1e293b"/>

  <!-- Stylish Glasses -->
  <rect x="165" y="168" width="28" height="20" rx="4" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <rect x="207" y="168" width="28" height="20" rx="4" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <line x1="193" y1="178" x2="207" y2="178" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="179" cy="178" r="4" fill="#06b6d4"/>
  <circle cx="221" cy="178" r="4" fill="#06b6d4"/>

  <!-- Warm Smile -->
  <path d="M 188 212 Q 200 222 212 212" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Tech Symbols -->
  <text x="75" y="120" fill="#06b6d4" font-family="monospace" font-size="22" font-weight="bold">&lt;React/&gt;</text>
  <text x="270" y="130" fill="#8b5cf6" font-family="monospace" font-size="20" font-weight="bold">{JS}</text>
  <text x="60" y="270" fill="#10b981" font-family="monospace" font-size="22" font-weight="bold">API ⚡</text>
  <text x="280" y="280" fill="#f59e0b" font-family="monospace" font-size="22" font-weight="bold">MCA 🎓</text>
</svg>
